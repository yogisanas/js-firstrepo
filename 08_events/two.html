<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Chai aur code</h1>
    <button id="stop">Stop</button>
</body>
<script>
    //--1.  gives from browser not a core js part
    setTimeout(function(){     //--handler which has no name
        console.log("Yogita..");
    }, 2000)

    //--2.
    const sayYogita = function(){
        console.log("Yogita..");
    }
    setTimeout(sayYogita, 2000)  //--reference in setTimeout()
//-----------------------------------------------------------------------------
//--change <h1> value

    // document.querySelector('h1').innerHTML = "best JS series";

    const changeText = function(){
            document.querySelector('h1').innerHTML = "best JS series";
    }
    // setTimeout(changeText, 2000);

//------------------------------------------------------------------------------

const changeMe = setTimeout(changeText, 2000);

// clearTimeout(changeMe)   --need reference

document.querySelector('#stop').addEventListener('click', function(){
    clearTimeout(changeMe);
    console.log("STOPPED");
})

</script>
</html>
